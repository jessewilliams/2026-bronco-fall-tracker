<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bronco Fall 2026 — Game Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12222e;
    --ink-soft:#4a5c69;
    --ink-faint:#8b9aa5;
    --paper:#eef1f4;
    --card:#ffffff;
    --line:#d5dce2;
    --line-soft:#e6ebef;
    --filed:#2f8f4e;
    --missing:#b9c3ca;
    --alert:#c9432f;
    --radius:6px;
    --maxw:940px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:16px;
    line-height:1.5;
    font-variant-numeric:tabular-nums;
  }
  h1,h2,th,.masthead-meta,.stat-num,.score,.slot,.gamenum{
    font-family:"Barlow Condensed","Barlow",system-ui,sans-serif;
  }
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px 64px}

  /* masthead */
  .masthead{
    border-bottom:2px solid var(--ink);
    padding:28px 0 12px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .masthead h1{
    margin:0;
    font-size:clamp(34px,7vw,52px);
    font-weight:700;
    letter-spacing:-0.01em;
    line-height:0.95;
  }
  .masthead h1 span{display:block;font-size:0.45em;font-weight:500;color:var(--ink-soft);letter-spacing:0.02em;margin-top:6px}
  .masthead-meta{font-size:18px;color:var(--ink-soft);text-align:right;line-height:1.3}

  /* standings */
  .standings{margin:24px 0 32px;overflow-x:auto}
  table{border-collapse:collapse;width:100%;min-width:520px}
  th{
    font-size:15px;font-weight:600;letter-spacing:0.04em;color:var(--ink-soft);
    text-align:right;padding:0 8px 6px;border-bottom:1px solid var(--line);
  }
  th.t-team{text-align:left}
  td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line-soft);font-size:16px}
  td.t-team{text-align:left;font-weight:500}
  td.t-pct{font-weight:600}
  tbody tr.is-focus{background:#e3eaf0}
  .chip{
    display:inline-block;width:11px;height:11px;border-radius:2px;
    margin-right:9px;vertical-align:baseline;
    border:1px solid rgba(0,0,0,.18);
  }
  .muted{color:var(--ink-faint)}

  /* controls */
  .stats{
    display:grid;grid-template-columns:repeat(4,1fr);
    border:1px solid var(--line);border-radius:var(--radius);
    background:var(--card);overflow:hidden;
  }
  .stat{padding:12px 14px;border-left:1px solid var(--line-soft)}
  .stat:first-child{border-left:0}
  .stat-num{display:block;font-size:30px;font-weight:600;line-height:1}
  .stat-label{font-size:13px;color:var(--ink-soft)}
  .stat.is-alert .stat-num{color:var(--alert)}

  .bar{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;flex-wrap:wrap;margin:16px 0 20px;
  }
  .tabs{display:flex;gap:4px;background:#e2e8ed;padding:3px;border-radius:var(--radius)}
  .tab{
    font:inherit;font-weight:500;font-size:15px;
    border:0;background:none;color:var(--ink-soft);
    padding:6px 14px;border-radius:4px;cursor:pointer;
  }
  .tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(18,34,46,.12)}
  .picker{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink-soft)}
  select{
    font:inherit;font-size:15px;color:var(--ink);
    background:var(--card);border:1px solid var(--line);
    border-radius:4px;padding:6px 10px;
  }

  /* game log */
  .daygroup{margin-bottom:26px}
  .dayhead{
    display:flex;align-items:center;gap:12px;
    font-size:15px;font-weight:600;color:var(--ink-soft);
    padding-bottom:6px;margin-bottom:8px;border-bottom:1px solid var(--line);
  }
  .dayhead .day-tag{font-weight:500;color:var(--ink-faint)}

  .game{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:6px}
  .game.is-open{border-color:#b3bfc9}
  .gamehead{
    width:100%;display:flex;align-items:center;gap:12px;
    background:none;border:0;font:inherit;color:inherit;
    padding:11px 14px;cursor:pointer;text-align:left;
  }
  .gamehead:focus-visible{outline:2px solid var(--ink);outline-offset:-2px;border-radius:var(--radius)}
  .dots{display:flex;gap:5px;flex:0 0 auto}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--missing)}
  .dot.is-filed{background:var(--filed)}
  .dot.is-upcoming{background:var(--missing);opacity:.3}
  .gamenum{flex:0 0 26px;font-size:15px;color:var(--ink-faint)}
  .slot{flex:0 0 68px;font-size:16px;color:var(--ink-soft)}
  .matchup{flex:1 1 auto;min-width:0;font-weight:500}
  .matchup .at{color:var(--ink-faint);font-weight:400;margin:0 4px}
  .score{flex:0 0 auto;font-size:19px;font-weight:600}
  .caret{flex:0 0 auto;color:var(--ink-faint);transition:transform .18s ease}
  .game.is-open .caret{transform:rotate(90deg)}

  .body{display:none;padding:2px 14px 16px;border-top:1px solid var(--line-soft)}
  .game.is-open .body{display:block}

  .aff{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:15px;flex-wrap:wrap}
  .aff-role{color:var(--ink-faint);flex:0 0 52px}
  .aff-team{font-weight:500;flex:0 0 auto}
  .aff-status{margin-left:auto;font-size:14px}
  .aff-status.ok{color:var(--filed)}
  .aff-status.no{color:var(--alert)}
  .aff-status.soon{color:var(--ink-faint)}

  .pitchhead{font-size:14px;font-weight:600;color:var(--ink-soft);margin:16px 0 4px}
  .p-team{font-size:14.5px;font-weight:600;margin:12px 0 1px;padding-bottom:2px;border-bottom:1px solid var(--line)}
  .p-team:first-of-type{margin-top:4px}
  .p-name{padding-left:20px}
  .pitcher{display:grid;grid-template-columns:1fr 46px;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-soft)}
  .p-name{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .p-name .chip{margin-right:7px}
  .p-count{text-align:right;font-weight:600;font-size:15px}
  .p-bar{grid-column:1 / -1;height:4px;background:#e6ebef;border-radius:2px;overflow:hidden;margin-top:-4px}
  .p-bar span{display:block;height:100%;border-radius:2px}
  .empty{font-size:14.5px;color:var(--ink-faint);padding:10px 0 2px}

  @media (max-width:620px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .stat:nth-child(3){border-left:0}
    .stat:nth-child(n+3){border-top:1px solid var(--line-soft)}
    .slot{flex-basis:0;display:none}
    .masthead-meta{text-align:left}
    .pitcher{grid-template-columns:1fr 44px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <h1>Bronco<span>Morgan Hill PONY · Fall 2026</span></h1>
    <div class="masthead-meta">Saturdays, Sep 12 – Oct 31<br>Britton Middle School</div>
  </header>

  <section class="standings" aria-label="Standings">
    <table>
      <thead>
        <tr>
          <th class="t-team">Team</th><th>W</th><th>L</th><th>T</th>
          <th>GP</th><th>RS</th><th>RA</th><th>PCT</th>
        </tr>
      </thead>
      <tbody id="standings-body"></tbody>
    </table>
  </section>

  <section class="stats" aria-label="Affidavit summary">
    <div class="stat"><span class="stat-num" id="s-total">0</span><span class="stat-label">Total games</span></div>
    <div class="stat"><span class="stat-num" id="s-both">0</span><span class="stat-label">Both filed</span></div>
    <div class="stat is-alert"><span class="stat-num" id="s-missing">0</span><span class="stat-label">Missing</span></div>
    <div class="stat"><span class="stat-num" id="s-upcoming">0</span><span class="stat-label">Upcoming</span></div>
  </section>

  <div class="bar">
    <div class="tabs" role="tablist" aria-label="Filter games">
      <button class="tab" role="tab" data-tab="all" aria-selected="true">All</button>
      <button class="tab" role="tab" data-tab="missing" aria-selected="false">Missing</button>
      <button class="tab" role="tab" data-tab="upcoming" aria-selected="false">Upcoming</button>
    </div>
    <label class="picker">Team
      <select id="team-filter"><option value="all">All teams</option></select>
    </label>
  </div>

  <section id="log" aria-live="polite"></section>

</div>

<script>
/* ============================================================
   1. TEAMS
   ============================================================ */
// Team name -> jersey color (Barracudas=Black, Regulators=Grey, Ducks=Green,
// Tigers=Orange, Royals=Blue, Rangers=Navy).
const TEAM_COLORS = {
  Barracudas:"#1c1c1c", Ducks:"#1f8a4c", Rangers:"#1f3b73",
  Regulators:"#8a9299", Royals:"#2f80ed", Tigers:"#e8701a"
};

// Manual tiebreaker. Teams higher in this list win an equal PCT.
// Edit the order to match the league's adopted tiebreaker.
const TIEBREAKER = ["Barracudas","Ducks","Rangers","Regulators","Royals","Tigers"];

/* ============================================================
   2. SCHEDULE — game numbers run 1–24 in date/time order.
      Affidavit filenames use these numbers: game{#}{Team}.{ext}
   ============================================================ */
const SCHEDULE = [
  {n:1,  date:"2026-09-12", time:"9:00 AM",  away:"Ducks",      home:"Tigers"},
  {n:2,  date:"2026-09-12", time:"11:30 AM", away:"Barracudas", home:"Regulators"},
  {n:3,  date:"2026-09-12", time:"2:00 PM",  away:"Rangers",    home:"Royals"},
  {n:4,  date:"2026-09-19", time:"9:00 AM",  away:"Royals",     home:"Barracudas"},
  {n:5,  date:"2026-09-19", time:"11:30 AM", away:"Ducks",      home:"Rangers"},
  {n:6,  date:"2026-09-19", time:"2:00 PM",  away:"Tigers",     home:"Regulators"},
  {n:7,  date:"2026-09-26", time:"9:00 AM",  away:"Tigers",     home:"Rangers"},
  {n:8,  date:"2026-09-26", time:"11:30 AM", away:"Regulators", home:"Royals"},
  {n:9,  date:"2026-09-26", time:"2:00 PM",  away:"Barracudas", home:"Ducks"},
  {n:10, date:"2026-10-03", time:"9:00 AM",  away:"Ducks",      home:"Regulators"},
  {n:11, date:"2026-10-03", time:"11:30 AM", away:"Rangers",    home:"Barracudas"},
  {n:12, date:"2026-10-03", time:"2:00 PM",  away:"Royals",     home:"Tigers"},
  {n:13, date:"2026-10-10", time:"9:00 AM",  away:"Regulators", home:"Rangers"},
  {n:14, date:"2026-10-10", time:"11:30 AM", away:"Royals",     home:"Ducks"},
  {n:15, date:"2026-10-10", time:"2:00 PM",  away:"Tigers",     home:"Barracudas"},
  {n:16, date:"2026-10-17", time:"9:00 AM",  away:"Barracudas", home:"Royals"},
  {n:17, date:"2026-10-17", time:"11:30 AM", away:"Regulators", home:"Tigers"},
  {n:18, date:"2026-10-17", time:"2:00 PM",  away:"Rangers",    home:"Ducks"},
  {n:19, date:"2026-10-24", time:"9:00 AM",  away:"Rangers",    home:"Tigers"},
  {n:20, date:"2026-10-24", time:"11:30 AM", away:"Ducks",      home:"Barracudas"},
  {n:21, date:"2026-10-24", time:"2:00 PM",  away:"Royals",     home:"Regulators"},
  {n:22, date:"2026-10-31", time:"9:00 AM",  away:"Regulators", home:"Ducks"},
  {n:23, date:"2026-10-31", time:"11:30 AM", away:"Tigers",     home:"Royals"},
  {n:24, date:"2026-10-31", time:"2:00 PM",  away:"Barracudas", home:"Rangers"}
];

/* ============================================================
   3. GAME DATA — add one entry per game as affidavits arrive.

   filed:    which team submitted its OWN affidavit file, and the
             extension received. A team is only credited here when
             its own file exists — never from the opponent's book.
   score:    runs for away / home. Omit until known.
   pitchers: every pitcher who threw, from whichever affidavit
             reported it.

   {
     7: {
       filed:    { away:"xlsx", home:null },
       score:    { away:6, home:9 },
       pitchers: [
         { team:"Tigers",  name:"R. Alvarez", pitches:44 },
         { team:"Rangers", name:"T. Okafor",  pitches:18 }
       ]
     }
   }
   ============================================================ */
const GAME_DATA = {
  // Week 1 — Sat, Sep 12
  1: {
    filed:    { away:"jpeg", home:"pdf" },   // game1-ducks.jpeg, game1-tigers.pdf
    score:    { away:10, home:11 },
    pitchers: [
      { team:"Ducks",  name:"J. Williams", pitches:35 },
      { team:"Ducks",  name:"Barnett",     pitches:45 },
      { team:"Ducks",  name:"Miceli",      pitches:20 },
      { team:"Ducks",  name:"Soria",       pitches:46 },
      { team:"Tigers", name:"Rhett",       pitches:50 },
      { team:"Tigers", name:"Henrik",      pitches:28 },
      { team:"Tigers", name:"Dario",       pitches:33 }
    ]
  },
  2: {
    filed:    { away:"jpeg", home:null },    // game2-barracudas.jpeg
    score:    { away:6, home:9 },
    pitchers: [
      { team:"Barracudas", name:"Eli",    pitches:29 },
      { team:"Barracudas", name:"Avery",  pitches:44 },
      { team:"Barracudas", name:"Zavier", pitches:54 }
    ]
  },
  3: {
    filed:    { away:null, home:"pdf" },     // game3-royals.pdf
    score:    { away:2, home:12 },
    pitchers: [
      { team:"Royals", name:"Jesse", pitches:18 },
      { team:"Royals", name:"Casey", pitches:31 },
      { team:"Royals", name:"Mason", pitches:46 }
    ]
  }
};

/* ============================================================
   4. LOGIC
   ============================================================ */
const MAX_PITCHES = 85;

function barColor(p){
  if(p <= 20) return "#2f8f4e";
  if(p <= 35) return "#7aa32a";
  if(p <= 50) return "#d9a41a";
  if(p <= 65) return "#e07b26";
  if(p <= MAX_PITCHES) return "#c9432f";
  return "#8e1b12";
}
function parseDate(s){
  const [y,m,d] = s.split("-").map(Number);
  return new Date(y, m-1, d);
}
function fmtLong(s){
  return parseDate(s).toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
}
const TODAY = (()=>{ const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); })();

const games = SCHEDULE.map(g => {
  const data = GAME_DATA[g.n] || {};
  const filed = data.filed || {};
  const date = parseDate(g.date);
  const upcoming = date > TODAY;
  return {
    ...g,
    dateObj: date,
    upcoming,
    score: data.score || null,
    pitchers: data.pitchers || [],
    awayFiled: !!filed.away,
    homeFiled: !!filed.home,
    awayExt: filed.away || null,
    homeExt: filed.home || null
  };
});

function bothFiled(g){ return g.awayFiled && g.homeFiled; }
function isMissing(g){ return !g.upcoming && !bothFiled(g); }


function standings(){
  const rows = {};
  Object.keys(TEAM_COLORS).forEach(t => {
    rows[t] = {team:t, w:0, l:0, t_:0, gp:0, rs:0, ra:0};
  });
  games.forEach(g => {
    if(!g.score) return;
    const a = rows[g.away], h = rows[g.home];
    const as = g.score.away, hs = g.score.home;
    a.gp++; h.gp++;
    a.rs += as; a.ra += hs;
    h.rs += hs; h.ra += as;
    if(as > hs){ a.w++; h.l++; }
    else if(hs > as){ h.w++; a.l++; }
    else { a.t_++; h.t_++; }
  });
  return Object.values(rows).map(r => {
    r.pct = r.gp ? (r.w + 0.5 * r.t_) / r.gp : null;
    return r;
  }).sort((x,y) => {
    const px = x.pct === null ? -1 : x.pct;
    const py = y.pct === null ? -1 : y.pct;
    if(py !== px) return py - px;
    return TIEBREAKER.indexOf(x.team) - TIEBREAKER.indexOf(y.team);
  });
}

/* ============================================================
   5. RENDER
   ============================================================ */
let activeTab = "all";
let activeTeam = "all";
const openGames = new Set();

const chip = t => `<span class="chip" style="background:${TEAM_COLORS[t]}"></span>`;

function renderStandings(){
  document.getElementById("standings-body").innerHTML = standings().map(r => `
    <tr class="${activeTeam === r.team ? "is-focus" : ""}">
      <td class="t-team">${chip(r.team)}${r.team}</td>
      <td>${r.w}</td><td>${r.l}</td><td>${r.t_}</td>
      <td>${r.gp}</td><td>${r.rs}</td><td>${r.ra}</td>
      <td class="t-pct">${r.pct === null ? '<span class="muted">—</span>' : r.pct.toFixed(3).replace(/^0/,"")}</td>
    </tr>`).join("");
}

function visibleGames(){
  return games.filter(g => {
    if(activeTeam !== "all" && g.away !== activeTeam && g.home !== activeTeam) return false;
    if(activeTab === "missing") return isMissing(g);
    if(activeTab === "upcoming") return g.upcoming;
    return true;
  });
}

function renderStats(){
  const pool = games.filter(g => activeTeam === "all" || g.away === activeTeam || g.home === activeTeam);
  document.getElementById("s-total").textContent    = pool.length;
  document.getElementById("s-both").textContent     = pool.filter(bothFiled).length;
  document.getElementById("s-missing").textContent  = pool.filter(isMissing).length;
  document.getElementById("s-upcoming").textContent = pool.filter(g => g.upcoming).length;
}

function affRow(g, side){
  const team  = side === "away" ? g.away : g.home;
  const filed = side === "away" ? g.awayFiled : g.homeFiled;
  let status;
  if(filed)          status = `<span class="aff-status ok">Filed</span>`;
  else if(g.upcoming)status = `<span class="aff-status soon">Not played</span>`;
  else               status = `<span class="aff-status no">Missing</span>`;
  return `<div class="aff">
      <span class="aff-role">${side === "away" ? "Away" : "Home"}</span>
      <span class="aff-team">${chip(team)}${team}</span>
      ${status}
    </div>`;
}

function pitcherRows(g){
  if(!g.pitchers.length){
    return `<p class="empty">${g.upcoming
      ? "Pitch counts appear once this game is played and an affidavit is filed."
      : "No pitch counts recorded yet. Upload an affidavit for this game."}</p>`;
  }
  const order = [g.away, g.home];
  const teams = [...new Set(g.pitchers.map(p => p.team))]
    .sort((a,b) => order.indexOf(a) - order.indexOf(b));

  return teams.map(team => {
    const rows = g.pitchers.filter(p => p.team === team).map(p => {
      const pct = Math.min(100, (p.pitches / MAX_PITCHES) * 100);
      const over = p.pitches > MAX_PITCHES ? ' title="Over the 85-pitch day limit"' : "";
      return `<div class="pitcher"${over}>
          <span class="p-name">${p.name}</span>
          <span class="p-count">${p.pitches}</span>
          <span class="p-bar"><span style="width:${pct}%;background:${barColor(p.pitches)}"></span></span>
        </div>`;
    }).join("");
    return `<div class="p-team">${chip(team)}${team}</div>${rows}`;
  }).join("");
}

function dotClass(filed, upcoming){
  if(upcoming) return "dot is-upcoming";
  return filed ? "dot is-filed" : "dot";
}

function renderLog(){
  const list = visibleGames();
  const log = document.getElementById("log");
  if(!list.length){
    log.innerHTML = `<p class="empty">No games match this filter.</p>`;
    return;
  }
  const byDate = [];
  list.forEach(g => {
    let grp = byDate.find(d => d.date === g.date);
    if(!grp){ grp = {date:g.date, games:[]}; byDate.push(grp); }
    grp.games.push(g);
  });

  log.innerHTML = byDate.map(grp => {
    const played = grp.games.filter(g => !g.upcoming);
    const done   = played.filter(bothFiled).length;
    const tag = played.length
      ? `<span class="day-tag">${done} of ${played.length} complete</span>`
      : `<span class="day-tag">Upcoming</span>`;
    return `<div class="daygroup">
      <div class="dayhead">${fmtLong(grp.date)} ${tag}</div>
      ${grp.games.map(g => {
        const open = openGames.has(g.n);
        const score = g.score ? `<span class="score">${g.score.away}–${g.score.home}</span>` : "";
        return `<div class="game${open ? " is-open" : ""}" data-game="${g.n}">
          <button class="gamehead" aria-expanded="${open}">
            <span class="dots">
              <span class="${dotClass(g.awayFiled, g.upcoming)}" title="${g.away} affidavit"></span>
              <span class="${dotClass(g.homeFiled, g.upcoming)}" title="${g.home} affidavit"></span>
            </span>
            <span class="gamenum">${g.n}</span>
            <span class="slot">${g.time}</span>
            <span class="matchup">${g.away}<span class="at">@</span>${g.home}</span>
            ${score}
            <span class="caret">›</span>
          </button>
          <div class="body">
            ${affRow(g,"away")}
            ${affRow(g,"home")}
            <div class="pitchhead">Pitchers</div>
            ${pitcherRows(g)}
          </div>
        </div>`;
      }).join("")}
    </div>`;
  }).join("");

  log.querySelectorAll(".gamehead").forEach(btn => {
    btn.addEventListener("click", () => {
      const card = btn.closest(".game");
      const n = Number(card.dataset.game);
      if(openGames.has(n)) openGames.delete(n); else openGames.add(n);
      card.classList.toggle("is-open");
      btn.setAttribute("aria-expanded", openGames.has(n));
    });
  });
}

function renderAll(){ renderStandings(); renderStats(); renderLog(); }

/* controls */
const sel = document.getElementById("team-filter");
Object.keys(TEAM_COLORS).sort().forEach(t => {
  const o = document.createElement("option");
  o.value = t; o.textContent = t;
  sel.appendChild(o);
});
sel.addEventListener("change", e => { activeTeam = e.target.value; renderAll(); });

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected","false"));
    tab.setAttribute("aria-selected","true");
    activeTab = tab.dataset.tab;
    renderLog();
  });
});

renderAll();
</script>
</body>
</html>
